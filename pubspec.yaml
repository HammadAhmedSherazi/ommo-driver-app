name: ommo
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  general_repository: ^0.0.4
  location: ^8.0.1
  formz: ^0.8.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  responsive_framework: ^1.5.1
  flutter_svg: ^2.2.0
  here_sdk:
    path: plugins/here_sdk
  intl: ^0.20.2
  image_picker: ^1.2.0
  flutter_rating_bar: ^4.0.1
  permission_handler: ^12.0.1
  shimmer_animation: ^2.2.2
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  wakelock_plus: ^1.4.0
  http: ^1.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/appicon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/files/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Italic.ttf
          style: italic
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
